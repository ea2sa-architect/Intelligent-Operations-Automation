sonar.projectKey=ioa-governance-platform
sonar.projectName=IOA Governance Platform
sonar.sources=.
sonar.host.url=http://localhost:9010
sonar.token=${SONAR_TOKEN}
sonar.sourceEncoding=UTF-8

# Whitelist hand-authored code only. Everything else under services/*
# (Dockerfile, db.js, generated package.json, node_modules) is
# code-generated by bootstrap/bootstrap-platform.js from
# bootstrap/platform.config.yaml and gets overwritten by npm run
# bootstrap — scanning it would flag boilerplate as debt that isn't
# actionable and won't survive the next regen. services/*/index.js is
# an exception: it's hand-authored (see platform.config.yaml's
# preserveFiles), so it's included explicitly.
sonar.inclusions=\
  services/*/index.js,\
  services/*/src/**,\
  services/*/tests/**,\
  bootstrap/**,\
  scripts/**,\
  db/**,\
  web/src/**,\
  kong-plugins/**

sonar.exclusions=**/node_modules/**

sonar.tests=services/*/tests
sonar.test.inclusions=services/*/tests/**/*.test.js
