# ============================================================
# HTTPS SERVER — ioa.ea2sa.com
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name ioa.ea2sa.com;

    # ------------------------------------------------------------
    # SSL CERTIFICATES
    # ------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/ioa.ea2sa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ioa.ea2sa.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------------------
    # SECURITY HEADERS
    # ------------------------------------------------------------
    add_header Content-Security-Policy "frame-ancestors *;" always;
    add_header X-Content-Type-Options  "nosniff"            always;
    add_header X-XSS-Protection        "1; mode=block"      always;

    # ------------------------------------------------------------
    # ACME CHALLENGE (Certbot)
    # ------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # ------------------------------------------------------------
    # API REVERSE PROXY — forward /api/* to Kong on phoenix
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://phoenix:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ------------------------------------------------------------
    # STATIC ASSETS — long-lived cache (Vite content-hashed filenames)
    # ------------------------------------------------------------
    location /assets/ {
        alias      /var/www/ioa/assets/;
        access_log off;
        expires    365d;
        add_header Cache-Control "public, immutable";
    }

    # ------------------------------------------------------------
    # SPA — React Router client-side routing
    # All non-asset, non-api paths fall back to index.html
    # ------------------------------------------------------------
    root  /var/www/ioa;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------
    # LOGGING
    # ------------------------------------------------------------
    access_log /var/log/nginx/ioa.ea2sa.access.log combined;
    error_log  /var/log/nginx/ioa.ea2sa.error.log warn;
}

# ============================================================
# HTTP → HTTPS REDIRECT (ACME SAFE)
# ============================================================
server {
    listen 80;
    listen [::]:80;

    server_name ioa.ea2sa.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    return 301 https://$host$request_uri;
}
