# kind cluster for the IOA platform on Phoenix.
# __DATA_DIR__ is substituted by up.sh (host dir that holds PVC data, so the
# database survives deleting/recreating the cluster).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ioa
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __DATA_DIR__
        containerPath: /var/local-path-provisioner
    extraPortMappings:
      # Kong NodePort (k8s/40-gateway) -> host. nginx on gilbert proxies /api/ here.
      - containerPort: 30080
        hostPort: 18080
        listenAddress: "0.0.0.0"
        protocol: TCP
